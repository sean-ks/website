name: Update Novig stats

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novig-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch stats (lbtrading.com publishes the day's numbers around 04:00 UTC)
        run: node scripts/update-novig-stats.mjs

      - name: Commit if changed, rebase (safe, the bot only touches assets/novig-stats.js) and push
        run: |
          if [ -z "$(git status --porcelain -- assets/novig-stats.js)" ]; then
            echo "assets/novig-stats.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/novig-stats.js
          git commit -m "Update Novig stats snapshot"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
